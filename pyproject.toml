[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-campus-placement-agent"
version = "1.0.0"
description = "AI-powered multi-agent assistant for campus placement preparation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AI Campus Placement Agent Contributors"}
]
maintainers = [
    {name = "AI Campus Placement Agent Contributors"}
]
keywords = [
    "ai",
    "agents",
    "placement",
    "resume",
    "interview",
    "career",
    "education",
    "flask",
    "gemini"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Education",
    "Topic :: Office/Business",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
]
requires-python = ">=3.9"
dependencies = [
    "Flask==3.0.3",
    "google-genai>=0.2.0",
    "PyPDF2==3.0.1",
    "python-dotenv==1.0.1",
    "reportlab==4.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/deepikagandla74/ai-campus-placement-agent"
Documentation = "https://github.com/deepikagandla74/ai-campus-placement-agent#readme"
Repository = "https://github.com/deepikagandla74/ai-campus-placement-agent"
Issues = "https://github.com/deepikagandla74/ai-campus-placement-agent/issues"

[tool.setuptools]
packages = []

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=html --cov-report=term"
